name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.4']

    env:
      CASDOOR_TEST_ENDPOINT: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Start local Casdoor
        run: |
          docker run -d --name casdoor \
            -p 8000:8000 \
            -e driverName=sqlite \
            -e dataSourceName='file:casdoor.db?cache=shared' \
            -e initDataFile=/init_data.json \
            -v "$PWD/.ci/casdoor/init_data.json:/init_data.json:ro" \
            casbin/casdoor-all-in-one

          for i in {1..60}; do
            if curl -fsS http://localhost:8000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs casdoor
          exit 1

      - name: Run tests
        run: bundle exec rspec

      - name: Dump Casdoor logs
        if: failure()
        run: docker logs casdoor

  release:
    needs: [lint, test]
    if: github.repository == 'casdoor/casdoor-ruby-sdk' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Gets a short-lived RubyGems API key with Trusted Publishing, so that no RubyGems secret is stored
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/exec
          semantic-release
